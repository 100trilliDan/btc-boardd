<script>
/* 두 전략의 순수 계산 코어 (브라우저/노드 공용). 미래참조 없음: 모든 상위봉 값은 '마감된' 봉만 사용. */
(function (root) {
  const H = 3600e3, DAY = 24 * H;
  const FEE = 0.0005, SLIP = 0.0001;
  function mk(rows, ms) { // rows: [openTime,o,h,l,c,v]
    const n = rows.length, B = { n, ms, t: new Array(n), o: new Array(n), h: new Array(n), l: new Array(n), c: new Array(n), v: new Array(n) };
    for (let i = 0; i < n; i++) { const r = rows[i]; B.t[i] = +r[0]; B.o[i] = +r[1]; B.h[i] = +r[2]; B.l[i] = +r[3]; B.c[i] = +r[4]; B.v[i] = +r[5]; }
    return B;
  }
  function agg(b, f) { // f개씩 묶기(에포크 기준 빈, 가득 찬 묶음만) = 파이썬 make_bars와 동일
    const rows = []; let cur = null, bin = null, cnt = 0;
    const flush = () => { if (cur && cnt === f) rows.push(cur); };
    for (let i = 0; i < b.n; i++) {
      const bi = Math.floor(b.t[i] / (f * b.ms));
      if (bi !== bin) { flush(); bin = bi; cnt = 0; cur = [bi * f * b.ms, b.o[i], b.h[i], b.l[i], b.c[i], 0]; }
      cur[2] = Math.max(cur[2], b.h[i]); cur[3] = Math.min(cur[3], b.l[i]); cur[4] = b.c[i]; cur[5] += b.v[i]; cnt++;
    }
    flush(); return mk(rows, f * b.ms);
  }
  function alignTo(hi, arr, lo) { // 하위봉 마감 시점에 이미 마감된 마지막 상위봉 값
    const out = new Array(lo.n).fill(NaN); let j = -1;
    for (let i = 0; i < lo.n; i++) {
      const lc = lo.t[i] + lo.ms;
      while (j + 1 < hi.n && hi.t[j + 1] + hi.ms <= lc) j++;
      if (j >= 0) out[i] = arr[j];
    }
    return out;
  }
  function hhPrev(b, n) { const o = new Array(b.n).fill(NaN); for (let i = n; i < b.n; i++) { let m = -Infinity; for (let k = i - n; k < i; k++) if (b.h[k] > m) m = b.h[k]; o[i] = m; } return o; }
  function swingHigh(b, k) {
    const n = b.n, PH = new Array(n).fill(NaN);
    for (let j = k; j <= n - k - 1; j++) { let m = -Infinity; for (let q = j - k; q <= j + k; q++) if (b.h[q] > m) m = b.h[q]; if (b.h[j] === m) PH[j + k] = b.h[j]; }
    for (let i = 1; i < n; i++) if (isNaN(PH[i])) PH[i] = PH[i - 1];
    return PH;
  }
  function atr(b, n = 14) { const a = new Array(b.n); const al = 1 / n; for (let i = 0; i < b.n; i++) { const pc = i ? b.c[i - 1] : b.c[0]; const tr = Math.max(b.h[i] - b.l[i], Math.abs(b.h[i] - pc), Math.abs(b.l[i] - pc)); a[i] = i ? a[i - 1] * (1 - al) + tr * al : tr; } return a; }
  function volRatio(b, n = 20) { const o = new Array(b.n).fill(NaN); let s = 0; for (let i = 0; i < b.n; i++) { if (i >= n) { const m = s / n; o[i] = b.v[i] / m; } s += b.v[i]; if (i >= n) s -= b.v[i - n]; } return o; }
  const LEVELS = [
    { id: "sw_d3", name: "일봉 스윙고점(3)", tf: "D", kind: "sw", p: 3 }, { id: "sw_d7", name: "일봉 스윙고점(7)", tf: "D", kind: "sw", p: 7 },
    { id: "sw_w2", name: "주봉 스윙고점(2)", tf: "W", kind: "sw", p: 2 }, { id: "dc_d30", name: "30일 고점", tf: "D", kind: "dc", p: 30 },
    { id: "dc_d60", name: "60일 고점", tf: "D", kind: "dc", p: 60 }, { id: "dc_w13", name: "13주 고점", tf: "W", kind: "dc", p: 13 }, { id: "dc_w26", name: "26주 고점", tf: "W", kind: "dc", p: 26 }];
  function levelSeries(D, W) { // 각 레벨의 상위봉 시계열
    const out = {};
    for (const L of LEVELS) { const hb = L.tf === "D" ? D : W; out[L.id] = L.kind === "sw" ? swingHigh(hb, L.p) : hhPrev(hb, L.p); }
    return out;
  }
  /* ───── 전략 A: 일·주봉 핵심자리 첫 돌파 + 거래량 2배 (트리거 TF: 1h/4h) ───── */
  function swingEvents(trig, D, W, mult = 2.0) {
    const LS = levelSeries(D, W), vr = volRatio(trig), ev = [];
    for (const L of LEVELS) {
      const hb = L.tf === "D" ? D : W, LH = alignTo(hb, LS[L.id], trig); let used = NaN;
      for (let i = 1; i < trig.n; i++) {
        if (isNaN(LH[i]) || isNaN(vr[i])) continue;
        if (vr[i] >= mult && trig.c[i] > LH[i] && trig.c[i - 1] <= LH[i] && LH[i] !== used) { ev.push({ i, id: L.id, name: L.name, level: LH[i], vr: vr[i], closeT: trig.t[i] + trig.ms, tfH: trig.ms / H }); used = LH[i]; }
      }
    }
    ev.sort((a, b) => a.closeT - b.closeT); return ev;
  }
  function currentLevels(trig, D, W) { // 최신 마감봉 기준 레벨값
    const LS = levelSeries(D, W), out = [];
    for (const L of LEVELS) { const hb = L.tf === "D" ? D : W; const v = alignTo(hb, LS[L.id], trig); out.push({ id: L.id, name: L.name, level: v[trig.n - 1] }); }
    return out;
  }
  function swingPlan(b15, k, ep) { // k: 마지막 마감 15분봉 인덱스, ep: 기준가
    const a = atr(b15); let lo = Infinity; for (let q = Math.max(0, k - 15); q <= k; q++) lo = Math.min(lo, b15.l[q]);
    let stop = lo - 0.5 * a[k], sp = (ep - stop) / ep;
    if (sp < 0.004) { stop = ep * (1 - 0.004); sp = 0.004; } if (sp > 0.035) { stop = ep * (1 - 0.035); sp = 0.035; }
    return { entry: ep, stop, sp, tp1: ep * 1.105, tp2: ep * 1.28 };
  }
  /* ───── 전략 B: 일목균형표 4시간봉 (전환선·기준선 골든/데드크로스, 구름 위/아래) ───── */
  function roll(arr, n, fn) { const o = new Array(arr.length).fill(NaN); for (let i = n - 1; i < arr.length; i++) { let m = fn === "max" ? -Infinity : Infinity; for (let k = i - n + 1; k <= i; k++) m = fn === "max" ? Math.max(m, arr[k]) : Math.min(m, arr[k]); o[i] = m; } return o; }
  function ichimoku(b) {
    const hh9 = roll(b.h, 9, "max"), ll9 = roll(b.l, 9, "min"), hh26 = roll(b.h, 26, "max"), ll26 = roll(b.l, 26, "min"), hh52 = roll(b.h, 52, "max"), ll52 = roll(b.l, 52, "min");
    const ten = hh9.map((x, i) => (x + ll9[i]) / 2), kij = hh26.map((x, i) => (x + ll26[i]) / 2);
    const saR = ten.map((x, i) => (x + kij[i]) / 2), sbR = hh52.map((x, i) => (x + ll52[i]) / 2);
    const top = new Array(b.n).fill(NaN), bot = new Array(b.n).fill(NaN);
    for (let i = 26; i < b.n; i++) { top[i] = Math.max(saR[i - 26], sbR[i - 26]); bot[i] = Math.min(saR[i - 26], sbR[i - 26]); }  // 26봉 전에 계산된 값 → 미래참조 없음
    return { ten, kij, top, bot };
  }
  function ichiSignals(b, I) {
    const sig = new Array(b.n).fill(0), c = b.c;
    for (let i = 1; i < b.n; i++) {
      const T = I.top[i], B = I.bot[i]; if (isNaN(T) || isNaN(I.ten[i]) || isNaN(I.kij[i]) || isNaN(I.ten[i - 1]) || isNaN(I.kij[i - 1])) continue;
      const L = I.ten[i] > I.kij[i] && I.ten[i - 1] <= I.kij[i - 1] && c[i] > T;
      const S = I.ten[i] < I.kij[i] && I.ten[i - 1] >= I.kij[i - 1] && c[i] < B;
      if (L) sig[i] = 1; else if (S) sig[i] = -1;
    }
    return sig;
  }
  const clip = (x, lo, hi) => Math.min(Math.max(x, lo), hi);
  function ichiStop(s, c, kij) { return s > 0 ? clip(kij, c * 0.92, c * 0.99) : clip(kij, c * 1.01, c * 1.08); }
  function ichiSim(b, I, sig, startIdx = 0) { // 한 종목 1포지션씩. 청산: 손절 / 종가가 구름 반대편(다음 봉 시가) — 파이썬 simulate와 동일 규칙
    const trades = []; let i = startIdx; const n = b.n;
    while (i < n - 1) {
      let k = -1; for (let q = i; q < n - 1; q++) if (sig[q] !== 0) { k = q; break; } if (k < 0) break;
      i = k; const s = sig[i], e = i + 1, entry = b.o[e] * (1 + s * SLIP), sl0 = ichiStop(s, b.c[i], I.kij[i]), risk = (entry - sl0) * s;
      if (!(risk > 0)) { i++; continue; }
      let js = -1, je = -1;
      for (let x = e; x <= n - 1; x++) if (s > 0 ? b.l[x] <= sl0 : b.h[x] >= sl0) { js = x - e; break; }
      for (let x = e; x <= n - 2; x++) if (s > 0 ? b.c[x] < I.bot[x] : b.c[x] > I.top[x]) { je = x - e; break; }
      let kind = null, best = Infinity;
      if (js >= 0) { best = js + 0.25; kind = "S"; } if (je >= 0 && je + 1.0 < best) { best = je + 1.0; kind = "X"; }
      let x, px, why, nxt, open = false;
      if (kind === "S") { x = e + Math.floor(best); const lvl = sl0; px = s > 0 ? Math.min(b.o[x], lvl) : Math.max(b.o[x], lvl); why = "손절"; nxt = x; }
      else if (kind === "X") { x = e + Math.floor(best); px = b.o[x]; why = s > 0 ? "구름하단 이탈" : "구름상단 돌파"; nxt = x - 1; }
      else { x = n - 1; px = b.c[x]; why = "보유중"; nxt = x; open = true; }
      const exitPx = px * (1 - s * SLIP), gross = (exitPx - entry) * s / risk, fees = FEE * (entry + exitPx) / risk;
      trades.push({ sig: i, e, x, side: s, entry, stop: sl0, exit: exitPx, R: gross - fees, sf: risk / entry, why, open, openT: b.t[e], exitT: b.t[x] });
      i = Math.max(nxt, e);
      if (open) break;
    }
    return trades;
  }
  function ichiState(closedRows4h, formingRow) { // 마감봉 + 진행중 봉(있으면). 신호는 마감봉에서만, 진입은 진행중 봉 시가(=다음 봉 시가)로 기록
    const rows = formingRow ? closedRows4h.concat([formingRow]) : closedRows4h, b = mk(rows, 4 * H), I = ichimoku(b), sig = ichiSignals(b, I);
    if (formingRow) sig[b.n - 1] = 0;
    const nc = closedRows4h.length - 1;     // 마지막 마감봉 인덱스
    return { b, I, sig, nc, trades: ichiSim(b, I, sig, 0) };
  }
  function sizing(balance, riskPct, entry, stop) { // 계좌위험 = min(위험%, 3×손절폭), 레버리지 최대 3배
    const sp = Math.abs(entry - stop) / entry, rf = Math.min(riskPct, 3 * sp), notional = balance * rf / sp;
    return { sp, riskFrac: rf, notional, qty: notional / entry, lev: notional / balance, riskUSD: balance * rf };
  }
  const API = { mk, agg, alignTo, hhPrev, swingHigh, atr, volRatio, LEVELS, levelSeries, swingEvents, currentLevels, swingPlan, ichimoku, ichiSignals, ichiStop, ichiSim, ichiState, sizing };
  if (typeof module !== "undefined") module.exports = API; else root.STRAT = API;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
(function () {

const store = { get(k, d) { try { const v = localStorage.getItem("board2." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem("board2." + k, JSON.stringify(v)); } catch (e) {} } };
const cfg = { balance: store.get("balance", 1000), risk: store.get("risk", 1), auto: store.get("auto", true) };
const st = { tab: store.get("tab", "A"), chart: store.get("chart", "BTC"), data: null, demo: false, loading: false, timer: null, base: 0 };
const nf = (n, d = 0) => Number.isFinite(n) ? n.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d }) : "–";

  let lo = Math.min(...b.l.slice(a)), hi = Math.max(...b.h.slice(a)); if (st.tab === "B") for (let i = a; i < n; i++) { for (const v of [I.top[i], I.bot[i]]) if (Number.isFinite(v)) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }
  for (const x of lv) { lo = Math.min(lo, x.level); hi = Math.max(hi, x.level); }
  const W = 700, Hh = 230, ml = 6, mr = 56, mt = 8, mb = 16, X = (i) => ml + (i - a) / (K - 1) * (W - ml - mr), Y = (v) => mt + (1 - (v - lo) / (hi - lo)) * (Hh - mt - mb);
  const ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg"); svg.setAttribute("viewBox", "0 0 " + W + " " + Hh); svg.setAttribute("role", "img");
  const mk = (t, at, txt) => { const e = document.createElementNS(ns, t); for (const k in at) e.setAttribute(k, at[k]); if (txt != null) e.textContent = txt; svg.append(e); return e; };
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const dim = css("--fg-dim"), acc = css("--accent"), up = css("--up"), dn = css("--down"), fg = css("--fg");
  for (let g = 0; g <= 4; g++) { const v = lo + (hi - lo) * g / 4, y = Y(v); mk("line", { x1: ml, x2: W - mr, y1: y, y2: y, stroke: css("--line"), "stroke-width": 1 }); mk("text", { x: W - mr + 4, y: y + 4, fill: dim, "font-size": 10 }, nf(v, v >= 1000 ? 0 : v >= 10 ? 1 : 2)); }
  if (st.tab === "B") {
    let d = "", d2 = ""; const pts = []; for (let i = a; i < n; i++) if (Number.isFinite(I.top[i])) pts.push(i);
    if (pts.length > 1) { d = "M" + pts.map((i) => X(i) + "," + Y(I.top[i])).join("L") + "L" + pts.slice().reverse().map((i) => X(i) + "," + Y(I.bot[i])).join("L") + "Z"; mk("path", { d, fill: css("--cloud"), stroke: "none" }); }
    const line = (arr, col, w, dash) => { const p = []; for (let i = a; i < n; i++) if (Number.isFinite(arr[i])) p.push(X(i) + "," + Y(arr[i])); if (p.length > 1) mk("path", { d: "M" + p.join("L"), fill: "none", stroke: col, "stroke-width": w, "stroke-dasharray": dash || "" }); };
    line(I.kij, dn, 1.4); line(I.ten, up, 1.4);
  } else for (const x of lv) { const y = Y(x.level); mk("line", { x1: ml, x2: W - mr, y1: y, y2: y, stroke: acc, "stroke-width": 1, "stroke-dasharray": "4 3" }); mk("text", { x: ml + 2, y: y - 3, fill: acc, "font-size": 10 }, x.name + " " + nf(x.level, x.level >= 1000 ? 0 : 2)); }
  const p = []; for (let i = a; i < n; i++) p.push(X(i) + "," + Y(b.c[i])); mk("path", { d: "M" + p.join("L"), fill: "none", stroke: fg, "stroke-width": 1.6 });
  if (st.tab === "B") for (let i = a; i < n; i++) if (r.B.sig[i]) mk("circle", { cx: X(i), cy: Y(b.c[i]), r: 4, fill: r.B.sig[i] > 0 ? up : dn });
  mk("circle", { cx: X(n - 1), cy: Y(c.price), r: 3, fill: acc }); mk("text", { x: W - mr + 4, y: Y(c.price) - 5, fill: fg, "font-size": 10, "font-weight": 700 }, nf(c.price, c.price >= 1000 ? 0 : 2));
  mk("text", { x: ml, y: Hh - 3, fill: dim, "font-size": 10 }, ft(b.t[a])); mk("text", { x: W - mr, y: Hh - 3, fill: dim, "font-size": 10, "text-anchor": "end" }, ft(b.t[n - 1]));
  $("chart").replaceChildren(svg);
  const lg = $("legend"); lg.replaceChildren();
  const li = (col, t, dash) => { const s = el("span"); const i = el("i"); i.style.borderColor = col; if (dash) i.style.borderTopStyle = "dashed"; s.append(i, t); lg.append(s); };
  li(fg, "종가"); if (st.tab === "B") { li(up, "전환선"); li(dn, "기준선"); const s = el("span", null, "음영 = 구름 · ● 신호"); lg.append(s); } else li(acc, "돌파 레벨", true);
}

function render() {
  const d = st.data, ch = $("status");
  if (!d) { ch.className = "chip"; ch.textContent = st.loading ? "불러오는 중" : "데이터 없음"; return; }
  ch.className = "chip " + (d.live ? "live" : "warn"); ch.textContent = (d.live ? "실시간(" + d.src + ") " : "데모 데이터 ") + ft(d.at).slice(6);
  document.querySelectorAll(".tabs[role=tablist] button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.s === st.tab)));
  const an = SYMS.map((s) => analyze(d.coins[s]));
  renderSummary(an);
  const cc = $("coins"); cc.replaceChildren(); for (const r of an) cc.append(st.tab === "A" ? coinCardA(r) : coinCardB(r));
  const act = st.tab === "A" ? an.filter((r) => r.A.new.length).length : an.filter((r) => r.B.open).length;
  const note = el("p", "note", st.tab === "A" ? "현재 새 신호 " + act + "개 · 확정안은 동시에 3개까지만 진입합니다(세 코인이면 사실상 제한 없음)." : "현재 보유 중 " + act + "개 · 코인당 1포지션 규칙. 동시 3개 제한.");
  cc.append(note);
  renderChart(an); renderRecent(an); renderRules();
}
async function load() {
  if (st.loading) return; st.loading = true; $("refresh").disabled = true; render();
  try { st.data = st.demo ? demoAll() : await liveAll(); $("error").hidden = true; }
  catch (e) { if (!st.data) { $("error-msg").textContent = "바이낸스 시세를 불러오지 못했습니다 (" + (e && e.message || "네트워크 오류") + "). 인터넷, VPN, 지역 제한을 확인해 주세요."; $("error").hidden = false; } else toast("갱신 실패: 이전 데이터를 표시 중"); }
  finally { st.loading = false; $("refresh").disabled = false; }
  render();
}
function schedule() { clearInterval(st.timer); if (cfg.auto) st.timer = setInterval(() => { if (!document.hidden && !st.demo) load(); }, 60000); }
$("balance").value = cfg.balance; $("risk").value = cfg.risk; $("auto").checked = cfg.auto;
$("balance").onchange = (e) => { cfg.balance = Math.max(0, +e.target.value || 0); store.set("balance", cfg.balance); render(); };
$("risk").onchange = (e) => { cfg.risk = Math.min(3, Math.max(0.1, +e.target.value || 1)); e.target.value = cfg.risk; store.set("risk", cfg.risk); render(); };
$("auto").onchange = (e) => { cfg.auto = e.target.checked; store.set("auto", cfg.auto); schedule(); };
$("refresh").onclick = load; $("demo").onclick = () => { st.demo = true; load(); };
document.querySelectorAll(".tabs[role=tablist] button").forEach((b) => b.onclick = () => { st.tab = b.dataset.s; store.set("tab", st.tab); render(); });
if (!["A", "B"].includes(st.tab)) st.tab = "A";
window.__board = { st, render, load };
load(); schedule();
})();
</script>
</body>
</html>
