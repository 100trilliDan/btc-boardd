<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BTC 시그널 보드</title>
<style>
/* 레이아웃: 한 칸짜리 모바일 우선 보드. 위에서 아래로 가격 → 추천 → 차트 → 점수 → 근거. */
:root {
  --bg: #f1f4f6;
  --surface: #ffffff;
  --surface-2: #e9eef2;
  --line: #d7dee4;
  --fg: #121c26;
  --fg-dim: #566574;
  --accent: #2c5f94;
  --up: #0d8760;
  --down: #c4413a;
  --warn: #a96f12;
  --on-up: #ffffff;
  --on-down: #ffffff;
  --font: "Pretendard Variable", Pretendard, system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e151c; --surface: #16202a; --surface-2: #1d2a36; --line: #2a3947; --fg: #e5ecf2; --fg-dim: #8797a6;
    --accent: #78aadf; --up: #35bf8b; --down: #ee695d; --warn: #e2a63f; --on-up: #07150e; --on-down: #1a0705;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e151c; --surface: #16202a; --surface-2: #1d2a36; --line: #2a3947; --fg: #e5ecf2; --fg-dim: #8797a6;
  --accent: #78aadf; --up: #35bf8b; --down: #ee695d; --warn: #e2a63f; --on-up: #07150e; --on-down: #1a0705;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font);
  padding-block: max(14px, env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 12px; }
.num { font-variant-numeric: tabular-nums; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 헤더 */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.top h1 { font-size: 16px; font-weight: 650; margin: 0; letter-spacing: .01em; }
.top .meta { display: flex; align-items: center; gap: 8px; min-width: 0; }
.chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--fg-dim); white-space: nowrap; }
.chip.live { color: var(--up); }
.chip.demo { background: var(--warn); color: var(--surface); }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; height: 32px; padding: 0 12px; font-size: 12px; }
.icon-btn[disabled] { opacity: .5; cursor: default; }

/* 가격 */
.price { display: grid; gap: 6px; }
.price-main { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.price-main .p { font-size: 34px; font-weight: 650; letter-spacing: -.01em; }
.price-main .chg { font-size: 14px; font-weight: 600; }
.pos { color: var(--up); } .neg { color: var(--down); }
.stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--fg-dim); }
.stats b { color: var(--fg); font-weight: 600; }

/* 탭 */
.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 3px; }
.tabs button { border: 0; background: transparent; padding: 8px 4px; border-radius: 8px; font-weight: 600; color: var(--fg-dim); }
.tabs button small { display: block; font-weight: 400; font-size: 11px; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.card h2 { font-size: 12px; font-weight: 600; margin: 0 0 10px; color: var(--fg-dim); text-transform: uppercase; letter-spacing: .06em; }

/* 추천 */
.rec-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.badge { min-width: 64px; text-align: center; font-size: 22px; font-weight: 750; padding: 8px 12px; border-radius: 8px; background: var(--surface-2); color: var(--fg); }
.badge.long { background: var(--up); color: var(--on-up); }
.badge.short { background: var(--down); color: var(--on-down); }
.rec-head .txt { flex: 1; min-width: 0; }
.rec-mode { font-weight: 650; }
.rec-sub { font-size: 12px; color: var(--fg-dim); }
.ghost { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 5px 10px; font-size: 12px; }
.levels { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin: 0; }
.levels > div { min-width: 0; }
.levels dt { font-size: 11px; color: var(--fg-dim); }
.levels dd { margin: 0; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.levels dd small { font-size: 11px; font-weight: 400; color: var(--fg-dim); }
.levels .wide { grid-column: 1 / -1; }
.status { margin: 12px 0 0; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); font-size: 13px; }
.status.warn { color: var(--warn); }
.note { margin: 8px 0 0; font-size: 11px; color: var(--fg-dim); }
.wait { margin: 0; color: var(--fg-dim); }
.wait strong { color: var(--fg); }

/* 차트 */
.chart-wrap { position: relative; }
#chart { width: 100%; height: 280px; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11px; color: var(--fg-dim); margin-top: 6px; }
.legend i { display: inline-block; width: 14px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 4px; }

/* 점수 */
.scores { display: grid; gap: 10px; }
.score-row { display: grid; grid-template-columns: 56px 1fr 44px; align-items: center; gap: 10px; font-size: 13px; }
.score-row .val { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.track { position: relative; height: 8px; border-radius: 4px; background: var(--surface-2); }
.track .mid { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--fg-dim); opacity: .6; }
.track .fill { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.track .thr { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 1px dashed var(--warn); }
.score-row.total { padding-top: 8px; border-top: 1px solid var(--line); font-weight: 650; }

.why { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.why li { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); }

/* 설정 */
details.settings summary { cursor: pointer; font-weight: 600; font-size: 13px; }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; margin-top: 12px; }
.form label { display: grid; gap: 4px; font-size: 12px; color: var(--fg-dim); min-width: 0; }
.form input[type="number"] { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.form .check { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; color: var(--fg); font-size: 13px; }

.error { border: 1px solid var(--down); }
.error p { margin: 0 0 10px; }
.error .row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 7px 12px; font-weight: 600; }
.foot { font-size: 11px; color: var(--fg-dim); margin: 4px 0 0; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(20px, env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; }
@media (max-width: 380px) { .price-main .p { font-size: 28px; } .levels dd { font-size: 14px; } }
@media (prefers-reduced-motion: no-preference) { .track .fill { transition: width .25s ease; } }
</style>

<body>
<div class="wrap">
  <header class="top">
    <h1>BTC 시그널 보드</h1>
    <div class="meta">
      <span class="chip" id="status">불러오는 중</span>
      <button class="icon-btn" id="refresh" type="button">새로고침</button>
    </div>
  </header>

  <section class="price" aria-label="현재 시세">
    <div class="price-main"><span class="p num" id="price">–</span><span class="chg num" id="chg"></span></div>
    <div class="stats" id="stats"></div>
  </section>

  <div class="tabs" role="tablist" aria-label="매매 스타일">
    <button type="button" role="tab" id="tab-scalp" data-mode="scalp" aria-selected="false">단타<small>15m 진입 · 1h 추세</small></button>
    <button type="button" role="tab" id="tab-swing" data-mode="swing" aria-selected="true">스윙<small>4h 진입 · 1d 추세</small></button>
  </div>

  <section class="card error" id="error" hidden>
    <p id="error-msg"></p>
    <div class="row">
      <button class="btn" id="retry" type="button">다시 시도</button>
      <button class="btn" id="demo-btn" type="button">데모 데이터로 보기</button>
    </div>
  </section>

  <section class="card" id="rec-card" aria-live="polite">
    <h2>추천</h2>
    <div id="rec"></div>
  </section>

  <section class="card">
    <h2>차트 · 최근 확정 봉</h2>
    <div class="chart-wrap"><canvas id="chart" aria-label="캔들 차트와 진입·손절·목표 가격선" role="img"></canvas></div>
    <div class="legend">
      <span><i style="border-color:var(--accent)"></i>EMA20</span>
      <span><i style="border-color:var(--fg-dim)"></i>EMA50</span>
      <span><i style="border-color:var(--down);border-top-style:dashed"></i>손절</span>
      <span><i style="border-color:var(--up);border-top-style:dashed"></i>목표</span>
    </div>
  </section>

  <section class="card">
    <h2>점수 구성</h2>
    <div class="scores" id="scores"></div>
  </section>

  <section class="card">
    <h2>판단 근거</h2>
    <ul class="why" id="why"></ul>
  </section>

  <section class="card">
    <details class="settings">
      <summary>설정</summary>
      <div class="form">
        <label for="s-balance">계좌 잔고 (USDT)<input id="s-balance" type="number" inputmode="decimal" min="1" step="any"></label>
        <label for="s-risk">1회 리스크 (%)<input id="s-risk" type="number" inputmode="decimal" min="0.1" max="10" step="0.1"></label>
        <label for="s-min">진입 최소 점수<input id="s-min" type="number" inputmode="decimal" min="0.5" max="6" step="0.5"></label>
        <label class="check" for="s-auto"><input id="s-auto" type="checkbox"> 60초마다 자동 갱신</label>
      </div>
    </details>
  </section>

  <p class="foot">참고용 규칙 기반 신호이며 투자 조언이 아닙니다. 손절가는 반드시 거래소에 실제 주문으로 걸고, 규칙은 btc_backtest.py로 검증한 뒤 사용하세요. 설정값은 이 기기 브라우저에만 저장됩니다.</p>
</div>
<div id="toast" role="status" hidden></div>

<script>
// ───────── 신호 코어: btc_signal.py 로직의 JS 이식 (DOM 의존 없음) ─────────
const MODES = {
  scalp: { name: "단타", trendTf: "1h", entryTf: "15m", slAtr: 1.2, tpR: [1.5, 2.5], maxLev: 20 },
  swing: { name: "스윙", trendTf: "1d", entryTf: "4h", slAtr: 2.0, tpR: [2.0, 3.5], maxLev: 5 },
};

// pandas ewm(adjust=False) 와 동일: 앞쪽 NaN은 건너뛰고 첫 유효값에서 시작
function ewm(arr, alpha) {
  const out = new Array(arr.length).fill(NaN);
  let prev = NaN;
  for (let i = 0; i < arr.length; i++) {
    const x = arr[i];
    if (Number.isNaN(x)) continue;
    prev = Number.isNaN(prev) ? x : alpha * x + (1 - alpha) * prev;
    out[i] = prev;
  }
  return out;
}

// k = { o, h, l, c, v } 배열. 모든 지표는 과거 방향으로만 계산(룩어헤드 없음)
function indicators(k) {
  const n = k.c.length;
  const ema20 = ewm(k.c, 2 / 21), ema50 = ewm(k.c, 2 / 51), ema200 = ewm(k.c, 2 / 201);
  const d = k.c.map((x, i) => (i ? x - k.c[i - 1] : NaN));
  const up = ewm(d.map((x) => Math.max(x, 0)), 1 / 14);
  const dn = ewm(d.map((x) => Math.max(-x, 0)), 1 / 14);
  const rsi = up.map((u, i) => (dn[i] === 0 ? NaN : 100 - 100 / (1 + u / dn[i])));
  const tr = k.c.map((_, i) => {
    const hl = k.h[i] - k.l[i];
    if (!i) return hl;
    return Math.max(hl, Math.abs(k.h[i] - k.c[i - 1]), Math.abs(k.l[i] - k.c[i - 1]));
  });
  const atr = ewm(tr, 1 / 14);
  const e12 = ewm(k.c, 2 / 13), e26 = ewm(k.c, 2 / 27);
  const m = e12.map((x, i) => x - e26[i]);
  const sig = ewm(m, 2 / 10);
  const macdH = m.map((x, i) => x - sig[i]);
  const volMa = new Array(n).fill(NaN);
  let s = 0;
  for (let i = 0; i < n; i++) {
    s += k.v[i];
    if (i >= 20) s -= k.v[i - 20];
    if (i >= 19) volMa[i] = s / 20;
  }
  return { ...k, ema20, ema50, ema200, rsi, atr, macdH, volMa };
}

// T: 상위 TF 지표, j: 사용할 마지막(확정) 봉 인덱스
function trendScore(T, j) {
  let s = 0;
  const why = [];
  if (T.c[j] > T.ema200[j]) { s += 1; why.push("종가>EMA200"); } else { s -= 1; why.push("종가<EMA200"); }
  if (T.ema20[j] > T.ema50[j]) { s += 1; why.push("EMA20>EMA50"); } else { s -= 1; why.push("EMA20<EMA50"); }
  const slope = T.ema50[j] / T.ema50[j - 5] - 1;
  if (slope > 0.002) { s += 1; why.push("EMA50 상승 기울기"); }
  else if (slope < -0.002) { s -= 1; why.push("EMA50 하락 기울기"); }
  return [s, why];
}

function entryScore(E, i, hint) {
  const p = i - 1;
  let s = 0;
  const why = [];
  if (E.macdH[i] > E.macdH[p]) { s += hint > 0 ? 1 : -1; why.push("MACD 히스토그램 상승"); }
  else { s += hint > 0 ? -1 : 1; why.push("MACD 히스토그램 하락"); }
  const rsi = E.rsi[i];
  if (hint > 0) {
    if (rsi >= 40 && rsi <= 60) { s += 1; why.push(`RSI ${rsi.toFixed(0)} 눌림구간(롱 유리)`); }
    else if (rsi > 72) { s -= 1; why.push(`RSI ${rsi.toFixed(0)} 과열(롱 불리)`); }
  } else {
    if (rsi >= 40 && rsi <= 60) { s -= 1; why.push(`RSI ${rsi.toFixed(0)} 반등구간(숏 유리)`); }
    else if (rsi < 28) { s += 1; why.push(`RSI ${rsi.toFixed(0)} 과매도(숏 불리)`); }
  }
  const dist = (E.c[i] - E.ema20[i]) / E.atr[i];
  if (Math.abs(dist) < 0.8) { s += 0.5 * hint; why.push("EMA20 근접(눌림 진입 구간)"); }
  if (E.v[i] > 1.3 * E.volMa[i]) { s += 0.5 * (E.c[i] > E.o[i] ? 1 : -1); why.push("거래량 급증 동반"); }
  return [s, why];
}

function derivScore(d) {
  if (!d) return [0, ["파생 데이터 없음(점수 미반영)"]];
  let s = 0;
  const why = [];
  const f = d.funding;
  if (f > 0.0005) { s -= 0.5; why.push(`펀딩비 ${(f * 100).toFixed(3)}% 롱 과열`); }
  else if (f < -0.0005) { s += 0.5; why.push(`펀딩비 ${(f * 100).toFixed(3)}% 숏 과열`); }
  else why.push(`펀딩비 ${(f * 100).toFixed(3)}% 중립`);
  if (d.oiChg24h != null) why.push(`OI 24h ${d.oiChg24h >= 0 ? "+" : ""}${d.oiChg24h.toFixed(1)}%`);
  return [s, why];
}

// T/E: indicators() 결과, j/i: 각 TF의 마지막 확정 봉 인덱스
function recommend(cfg, T, j, E, i, derivs, balance, riskPct, minScore) {
  const [tS, tWhy] = trendScore(T, j);
  const hint = tS > 0 ? 1 : tS < 0 ? -1 : 0;
  const [eS, eWhy] = hint ? entryScore(E, i, hint) : [0, ["추세 불명확"]];
  const [dS, dWhy] = derivScore(derivs);
  const total = tS + eS + dS;
  const price = E.c[i], a = E.atr[i];
  const out = { mode: cfg.name, price, score: total, t: tS, e: eS, d: dS, why: [...tWhy, ...eWhy, ...dWhy], side: "관망", ema20: E.ema20[i], atr: a };
  if (Math.abs(total) < minScore || hint === 0 || (total > 0) !== (hint > 0)) return out;

  const side = total > 0 ? "롱" : "숏";
  const sign = side === "롱" ? 1 : -1;
  let lo = Infinity, hi = -Infinity;
  for (let q = Math.max(0, i - 19); q <= i; q++) { lo = Math.min(lo, E.l[q]); hi = Math.max(hi, E.h[q]); }
  const atrSl = price - sign * cfg.slAtr * a;
  const structSl = side === "롱" ? lo - 0.3 * a : hi + 0.3 * a;
  const sl = side === "롱" ? Math.min(atrSl, structSl) : Math.max(atrSl, structSl);
  const riskPerUnit = Math.abs(price - sl);
  const tp1 = price + sign * cfg.tpR[0] * riskPerUnit;
  const tp2 = price + sign * cfg.tpR[1] * riskPerUnit;
  const zone = [Math.min(price, E.ema20[i]), Math.max(price, E.ema20[i])];
  const riskUsdt = (balance * riskPct) / 100;
  const qty = riskUsdt / riskPerUnit;
  const notional = qty * price;
  const lev = balance ? Math.max(1, Math.min(cfg.maxLev, Math.ceil(notional / balance))) : null;
  return { ...out, side, entryZone: zone, sl, tp1, tp2, rr: cfg.tpR, qty, notional, lev, riskUsdt };
}

// 데모용: 진입 TF 랜덤워크 생성 후 상위 TF는 n개씩 묶어서 생성
function demoCandles(n, stepMs, seed) {
  let x = seed >>> 0;
  const rnd = () => ((x = (x * 1664525 + 1013904223) >>> 0) / 4294967296);
  const gauss = () => Math.sqrt(-2 * Math.log(rnd() + 1e-12)) * Math.cos(2 * Math.PI * rnd());
  const vol = 0.0035 * Math.sqrt(stepMs / 900000);
  const t0 = Math.floor(Date.now() / stepMs) * stepMs - n * stepMs;
  const out = [];
  let prev = 90000;
  for (let q = 0; q < n; q++) {
    const c = prev * Math.exp(0.00005 * Math.sin(q / 60) + vol * gauss());
    const hi = Math.max(prev, c) * (1 + Math.abs(gauss()) * vol * 0.4);
    const lo = Math.min(prev, c) * (1 - Math.abs(gauss()) * vol * 0.4);
    out.push({ t: t0 + q * stepMs, o: prev, h: hi, l: lo, c, v: 200 + rnd() * 800 });
    prev = c;
  }
  return out;
}
function groupCandles(arr, size) {
  const out = [];
  for (let q = 0; q + size <= arr.length; q += size) {
    const g = arr.slice(q, q + size);
    out.push({ t: g[0].t, o: g[0].o, h: Math.max(...g.map((x) => x.h)), l: Math.min(...g.map((x) => x.l)), c: g[size - 1].c, v: g.reduce((s, x) => s + x.v, 0) });
  }
  return out;
}
function toSeries(candles) {
  return { t: candles.map((x) => x.t), o: candles.map((x) => x.o), h: candles.map((x) => x.h), l: candles.map((x) => x.l), c: candles.map((x) => x.c), v: candles.map((x) => x.v) };
}

if (typeof module !== "undefined") module.exports = { MODES, ewm, indicators, recommend, trendScore, entryScore, derivScore, demoCandles, groupCandles, toSeries };

</script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const BASE = "https://fapi.binance.com";
  const TF_MS = { "15m": 900000, "1h": 3600000, "4h": 14400000, "1d": 86400000 };

  const store = {
    get(k, d) { try { const v = localStorage.getItem("btcboard." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("btcboard." + k, JSON.stringify(v)); } catch (e) { /* 저장 불가 환경 */ } },
  };
  const settings = {
    balance: store.get("balance", 1000), risk: store.get("risk", 1), minScore: store.get("minScore", 3),
    auto: store.get("auto", true), mode: store.get("mode", "swing"),
  };
  if (!MODES[settings.mode]) settings.mode = "swing";
  const state = { mode: settings.mode, cache: {}, demo: false, loading: false, timer: null, lastRec: null };

  // ───── 유틸 ─────
  const nf = (n, d = 0) => Number.isFinite(n) ? n.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d }) : "–";
  const pct = (a, base) => { const v = (a / base - 1) * 100; return (v >= 0 ? "+" : "") + v.toFixed(1) + "%"; };
  const pad2 = (n) => String(n).padStart(2, "0");
  const fmtTime = (t) => { const d = new Date(t); return pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes()); };
  function h(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 1800); }

  // ───── 데이터 ─────
  async function getJSON(path) {
    const r = await fetch(BASE + path);
    if (!r.ok) throw new Error("HTTP " + r.status + (r.status === 451 || r.status === 403 ? " (지역/IP 제한)" : ""));
    return r.json();
  }
  async function klines(interval) {
    const a = await getJSON("/fapi/v1/klines?symbol=BTCUSDT&interval=" + interval + "&limit=500");
    return a.map((x) => ({ t: x[0], o: +x[1], h: +x[2], l: +x[3], c: +x[4], v: +x[5], ct: x[6] }));
  }
  function build(entry, trend, extra) {
    // 마지막 봉은 진행 중이므로 신호 계산에서 제외 (확정 봉만 사용)
    const forming = entry[entry.length - 1];
    const E = indicators(toSeries(entry.slice(0, -1)));
    const T = indicators(toSeries(trend.slice(0, -1)));
    return Object.assign({ E, T, forming, livePrice: forming.c, fetchedAt: Date.now() }, extra);
  }
  async function liveData(mode) {
    const cfg = MODES[mode];
    const [ek, tk, prem, oi, tick] = await Promise.all([
      klines(cfg.entryTf), klines(cfg.trendTf),
      getJSON("/fapi/v1/premiumIndex?symbol=BTCUSDT").catch(() => null),
      getJSON("/futures/data/openInterestHist?symbol=BTCUSDT&period=1h&limit=24").catch(() => null),
      getJSON("/fapi/v1/ticker/24hr?symbol=BTCUSDT").catch(() => null),
    ]);
    let derivs = null, oiVal = null;
    if (prem && prem.lastFundingRate != null) {
      derivs = { funding: +prem.lastFundingRate, oiChg24h: null };
      if (Array.isArray(oi) && oi.length > 1) {
        const first = +oi[0].sumOpenInterestValue, last = +oi[oi.length - 1].sumOpenInterestValue;
        if (first > 0) derivs.oiChg24h = (last / first - 1) * 100;
        oiVal = last;
      }
    }
    const d = build(ek, tk, { live: true, derivs, oiVal, nextFunding: prem ? prem.nextFundingTime : null,
      chgPct: tick ? +tick.priceChangePercent : null });
    if (tick) d.livePrice = +tick.lastPrice;
    return d;
  }
  function demoData(mode) {
    const cfg = MODES[mode];
    const step = TF_MS[cfg.entryTf], size = TF_MS[cfg.trendTf] / step;
    const raw = demoCandles(size * 320, step, mode === "swing" ? 5 : 3);
    const trend = groupCandles(raw, size);
    const perDay = 86400000 / step, last = raw.length - 2;
    const d = build(raw, trend, { live: false, derivs: { funding: 0.0001, oiChg24h: 2.3 }, oiVal: null, nextFunding: null,
      chgPct: (raw[raw.length - 1].c / raw[last - perDay].c - 1) * 100 });
    d.forming = Object.assign({}, raw[raw.length - 1], { ct: raw[raw.length - 1].t + step - 1 });
    return d;
  }

  async function load(mode) {
    if (state.loading) return;
    state.loading = true; $("refresh").disabled = true;
    try {
      state.cache[mode] = state.demo ? demoData(mode) : await liveData(mode);
      $("error").hidden = true;
    } catch (err) {
      if (!state.cache[mode]) {
        $("error-msg").textContent = "바이낸스 시세를 불러오지 못했습니다 (" + (err && err.message ? err.message : "네트워크 오류") +
          "). 인터넷 연결, VPN, 지역 제한을 확인해 주세요. 화면 구성만 보려면 데모 데이터를 사용할 수 있습니다.";
        $("error").hidden = false;
      } else toast("갱신 실패: 이전 데이터를 표시 중");
    } finally {
      state.loading = false; $("refresh").disabled = false;
    }
    render();
  }

  // ───── 렌더 ─────
  function setTabs() {
    document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.mode === state.mode)));
  }
  function renderHeader(d) {
    const s = $("status");
    if (!d) { s.className = "chip"; s.textContent = state.loading ? "불러오는 중" : "데이터 없음"; return; }
    s.className = "chip " + (d.live ? "live" : "demo");
    s.textContent = d.live ? "실시간 " + fmtTime(d.fetchedAt).slice(6) : "데모 데이터";
  }
  function renderPrice(d) {
    if (!d) { $("price").textContent = "–"; $("chg").textContent = ""; $("stats").replaceChildren(); return; }
    $("price").textContent = nf(d.livePrice, 1);
    const c = $("chg");
    if (d.chgPct != null && Number.isFinite(d.chgPct)) { c.textContent = (d.chgPct >= 0 ? "+" : "") + d.chgPct.toFixed(2) + "% (24h)"; c.className = "chg num " + (d.chgPct >= 0 ? "pos" : "neg"); }
    else { c.textContent = ""; }
    const st = $("stats"); st.replaceChildren();
    const add = (k, v) => { const s = h("span"); s.append(k + " "); s.append(h("b", "num", v)); st.append(s); };
    if (d.derivs) add("펀딩비", (d.derivs.funding * 100).toFixed(4) + "%");
    if (d.derivs && d.derivs.oiChg24h != null) add("OI 24h", (d.derivs.oiChg24h >= 0 ? "+" : "") + d.derivs.oiChg24h.toFixed(1) + "%");
    if (d.nextFunding) add("다음 펀딩", fmtTime(d.nextFunding).slice(6));
    const cd = h("span"); cd.append("봉 마감까지 "); const b = h("b", "num", "–"); b.id = "countdown"; cd.append(b); st.append(cd);
    tickCountdown();
  }
  function tickCountdown() {
    const el = $("countdown"), d = state.cache[state.mode];
    if (!el || !d || !d.forming) return;
    const left = Math.max(0, Math.floor((d.forming.ct + 1 - Date.now()) / 1000));
    el.textContent = d.live || left > 0 ? (left >= 3600 ? Math.floor(left / 3600) + "시간 " + pad2(Math.floor(left % 3600 / 60)) + "분" : pad2(Math.floor(left / 60)) + ":" + pad2(left % 60)) : "–";
  }

  function liveStatus(rec, live) {
    const long = rec.side === "롱";
    const [z0, z1] = rec.entryZone;
    if (long ? live <= rec.sl : live >= rec.sl) return ["현재가가 이미 손절가를 벗어나 이 신호는 무효입니다.", true];
    if (long ? live >= rec.tp1 : live <= rec.tp1) return ["현재가가 1차 목표를 지나 신규 진입으로는 늦었습니다.", true];
    if (live >= z0 && live <= z1) return ["현재가가 진입 구간 안에 있습니다.", false];
    if (live > z1) return ["현재가가 진입 구간 위에 있습니다. " + (long ? "눌림을 기다리세요." : "추격 진입은 피하세요."), false];
    return ["현재가가 진입 구간 아래에 있습니다. " + (long ? "추격 진입은 피하세요." : "반등을 기다리세요."), false];
  }
  function copyText(rec, cfg) {
    return ["[BTC " + cfg.name + "] " + rec.side, "진입 " + nf(rec.entryZone[0], 1) + " ~ " + nf(rec.entryZone[1], 1),
      "손절 " + nf(rec.sl, 1), "1차 " + nf(rec.tp1, 1) + " / 2차 " + nf(rec.tp2, 1),
      "수량 " + rec.qty.toFixed(4) + " BTC, 레버리지 약 " + rec.lev + "x"].join(" | ");
  }
  function renderRec(rec, d, cfg) {
    const box = $("rec"); box.replaceChildren();
    const head = h("div", "rec-head");
    const badge = h("span", "badge " + (rec.side === "롱" ? "long" : rec.side === "숏" ? "short" : ""), rec.side);
    const txt = h("div", "txt");
    txt.append(h("div", "rec-mode", cfg.name + " · " + cfg.entryTf + " 진입 / " + cfg.trendTf + " 추세"));
    txt.append(h("div", "rec-sub num", "기준봉 종가 " + nf(rec.price, 1) + " · 종합 " + (rec.score >= 0 ? "+" : "") + rec.score.toFixed(1)));
    head.append(badge, txt);
    if (rec.side !== "관망") {
      const cp = h("button", "ghost", "복사"); cp.type = "button";
      cp.addEventListener("click", () => {
        const text = copyText(rec, cfg);
        const p = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(text) : Promise.reject();
        p.then(() => toast("복사했습니다"), () => toast("복사하지 못했습니다"));
      });
      head.append(cp);
    }
    box.append(head);

    if (rec.side === "관망") {
      const hint = rec.t > 0 ? 1 : rec.t < 0 ? -1 : 0;
      const p = h("p", "wait");
      if (hint === 0) p.append("상위 추세가 불명확해 ", h("strong", null, "진입하지 않는 것"), "이 규칙상 맞습니다.");
      else if (Math.abs(rec.score) < settings.minScore) p.append("종합 점수(" + rec.score.toFixed(1) + ")가 진입 기준 ±" + settings.minScore.toFixed(1) + "에 못 미쳐 ", h("strong", null, "관망"), "입니다. 새 봉이 마감되면 다시 계산됩니다.");
      else p.append("진입 신호가 상위 추세와 반대 방향이라 제외했습니다. ", h("strong", null, "관망"), "입니다.");
      box.append(p);
      return;
    }
    const dl = h("dl", "levels");
    const item = (k, vNode, wide) => { const w = h("div", wide ? "wide" : ""); w.append(h("dt", null, k)); const dd = h("dd"); dd.append(vNode); w.append(dd); dl.append(w); };
    const val = (t, cls, sub) => { const s = h("span", cls, t); if (!sub) return s; const f = document.createDocumentFragment(); f.append(s, " "); f.append(h("small", null, sub)); return f; };
    item("진입 구간", val(nf(rec.entryZone[0], 1) + " ~ " + nf(rec.entryZone[1], 1)), true);
    item("손절", val(nf(rec.sl, 1), "neg", pct(rec.sl, rec.price)));
    item("1차 목표 · " + rec.rr[0] + "R", val(nf(rec.tp1, 1), "pos", pct(rec.tp1, rec.price)));
    item("2차 목표 · " + rec.rr[1] + "R", val(nf(rec.tp2, 1), "pos", pct(rec.tp2, rec.price)));
    item("수량", val(rec.qty.toFixed(4) + " BTC"));
    item("레버리지(약)", val(rec.lev + "x"));
    item("명목 가치", val(nf(rec.notional, 0) + " USDT"));
    item("손절 시 손실", val(nf(rec.riskUsdt, 0) + " USDT", "neg", settings.risk + "%"));
    box.append(dl);
    const [msg, warn] = liveStatus(rec, d.livePrice);
    box.append(h("p", "status" + (warn ? " warn" : ""), msg));
    box.append(h("p", "note", "1차 목표에서 절반 청산 후 손절을 진입가로 옮기는 규칙을 가정한 수치입니다. 손절가가 청산가보다 안쪽인지 거래소에서 확인하세요."));
  }

  function renderScore(rec) {
    const box = $("scores"); box.replaceChildren();
    const row = (label, v, range, cls, thr) => {
      const r = h("div", "score-row " + (cls || ""));
      r.append(h("span", null, label));
      const tr = h("div", "track"); tr.append(h("span", "mid"));
      const f = h("span", "fill"); const w = Math.min(50, Math.abs(v) / range * 50);
      f.style.width = w + "%"; f.style[v >= 0 ? "left" : "right"] = "50%"; f.style.background = v >= 0 ? "var(--up)" : "var(--down)";
      tr.append(f);
      if (thr) [-1, 1].forEach((sg) => { const t = h("span", "thr"); t.style.left = (50 + sg * thr / range * 50) + "%"; tr.append(t); });
      r.append(tr, h("span", "val num", (v >= 0 ? "+" : "") + v.toFixed(1)));
      box.append(r);
    };
    row("추세", rec.t, 3); row("진입", rec.e, 3); row("파생", rec.d, 0.5);
    row("종합", rec.score, 6.5, "total", settings.minScore);
  }
  function renderWhy(rec) {
    const ul = $("why"); ul.replaceChildren();
    rec.why.forEach((w) => ul.append(h("li", null, w)));
  }

  // ───── 차트 ─────
  function drawChart(d, rec) {
    const cv = $("chart"), ctx = cv.getContext("2d");
    const dpr = window.devicePixelRatio || 1, W = cv.clientWidth || 320, H = cv.clientHeight || 280;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    if (!d) return;
    const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    const col = { up: css("--up"), down: css("--down"), dim: css("--fg-dim"), line: css("--line"), accent: css("--accent"), fg: css("--fg"), bg: css("--surface") };
    const E = d.E, N = Math.min(72, E.c.length), s0 = E.c.length - N;
    let lo = Infinity, hi = -Infinity;
    for (let q = s0; q < E.c.length; q++) { lo = Math.min(lo, E.l[q]); hi = Math.max(hi, E.h[q]); }
    const sig = rec.side !== "관망";
    const pts = [d.livePrice].concat(sig ? [rec.sl, rec.tp1, rec.entryZone[0], rec.entryZone[1]] : []);
    pts.forEach((p) => { lo = Math.min(lo, p); hi = Math.max(hi, p); });
    const span = (hi - lo) || 1; lo -= span * 0.04; hi += span * 0.04;
    const pad = { l: 6, r: 62, t: 10, b: 20 }, pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;
    const y = (p) => pad.t + (hi - p) / (hi - lo) * ph;
    const x = (q) => pad.l + (q - s0 + 0.5) * pw / N;
    ctx.font = "10px ui-monospace, Menlo, Consolas, monospace";
    // 격자·가격축
    ctx.lineWidth = 1; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    for (let g = 0; g <= 4; g++) {
      const p = lo + (hi - lo) * g / 4, yy = Math.round(y(p)) + 0.5;
      ctx.strokeStyle = col.line; ctx.beginPath(); ctx.moveTo(pad.l, yy); ctx.lineTo(W - pad.r, yy); ctx.stroke();
      ctx.fillStyle = col.dim; ctx.fillText(nf(p, 0), W - pad.r + 5, yy);
    }
    // 진입 구간
    if (sig) {
      ctx.globalAlpha = 0.16; ctx.fillStyle = col.accent;
      ctx.fillRect(pad.l, y(rec.entryZone[1]), pw, Math.max(2, y(rec.entryZone[0]) - y(rec.entryZone[1]))); ctx.globalAlpha = 1;
    }
    // 캔들
    const bw = Math.max(1, pw / N * 0.62);
    for (let q = s0; q < E.c.length; q++) {
      const up = E.c[q] >= E.o[q]; ctx.strokeStyle = ctx.fillStyle = up ? col.up : col.down;
      const xx = Math.round(x(q)) + 0.5;
      ctx.beginPath(); ctx.moveTo(xx, y(E.h[q])); ctx.lineTo(xx, y(E.l[q])); ctx.stroke();
      const top = y(Math.max(E.o[q], E.c[q])), bh = Math.max(1, Math.abs(y(E.o[q]) - y(E.c[q])));
      ctx.fillRect(xx - bw / 2, top, bw, bh);
    }
    // EMA
    const line = (arr, color) => {
      ctx.strokeStyle = color; ctx.lineWidth = 1.4; ctx.beginPath();
      for (let q = s0; q < E.c.length; q++) { const px = x(q), py = y(arr[q]); q === s0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py); }
      ctx.stroke(); ctx.lineWidth = 1;
    };
    line(E.ema50, col.dim); line(E.ema20, col.accent);
    // 가격선
    const hline = (p, color, label, dash) => {
      let yy = y(p), tag = label;
      if (yy < pad.t) { yy = pad.t; tag = "▲" + label; } else if (yy > pad.t + ph) { yy = pad.t + ph; tag = "▼" + label; }
      ctx.strokeStyle = color; ctx.setLineDash(dash ? [5, 4] : []); ctx.beginPath(); ctx.moveTo(pad.l, yy); ctx.lineTo(W - pad.r, yy); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = col.bg; const tw = ctx.measureText(tag).width + 6;
      ctx.fillRect(W - pad.r + 1, yy - 7, Math.min(tw, pad.r - 1), 14);
      ctx.fillStyle = color; ctx.fillText(tag, W - pad.r + 4, yy);
    };
    if (sig) { hline(rec.sl, col.down, "SL", true); hline(rec.tp1, col.up, "TP1", true); hline(rec.tp2, col.up, "TP2", true); }
    hline(d.livePrice, col.fg, nf(d.livePrice, 0), false);
    // 시간축
    ctx.fillStyle = col.dim; ctx.textBaseline = "alphabetic";
    [[s0, "left"], [s0 + Math.floor(N / 2), "center"], [E.c.length - 1, "right"]].forEach(([q, al]) => {
      ctx.textAlign = al; const xx = al === "left" ? pad.l : al === "right" ? W - pad.r : x(q);
      ctx.fillText(fmtTime(E.t[q]), xx, H - 5);
    });
  }

  function render() {
    setTabs();
    const d = state.cache[state.mode];
    renderHeader(d); renderPrice(d);
    if (!d) {
      $("rec").replaceChildren(h("p", "wait", state.loading ? "시세를 불러오는 중입니다." : "표시할 데이터가 없습니다."));
      $("scores").replaceChildren(); $("why").replaceChildren(); drawChart(null);
      return;
    }
    const cfg = MODES[state.mode];
    const rec = recommend(cfg, d.T, d.T.c.length - 1, d.E, d.E.c.length - 1, d.derivs, settings.balance, settings.risk, settings.minScore);
    state.lastRec = rec;
    renderRec(rec, d, cfg); renderScore(rec); renderWhy(rec); drawChart(d, rec);
  }

  // ───── 이벤트 ─────
  document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => {
    state.mode = b.dataset.mode; settings.mode = state.mode; store.set("mode", state.mode);
    render(); if (!state.cache[state.mode]) load(state.mode);
  }));
  $("refresh").addEventListener("click", () => load(state.mode));
  $("retry").addEventListener("click", () => load(state.mode));
  $("demo-btn").addEventListener("click", () => { state.demo = true; state.cache = {}; load(state.mode); });
  const bind = (id, key, parse, min, max) => {
    const el = $(id); el.value = settings[key];
    el.addEventListener("change", () => {
      let v = parse(el.value); if (!Number.isFinite(v)) v = settings[key];
      v = Math.min(max, Math.max(min, v)); el.value = v; settings[key] = v; store.set(key, v); render();
    });
  };
  bind("s-balance", "balance", parseFloat, 1, 1e9); bind("s-risk", "risk", parseFloat, 0.1, 10); bind("s-min", "minScore", parseFloat, 0.5, 6);
  $("s-auto").checked = !!settings.auto;
  $("s-auto").addEventListener("change", (e) => { settings.auto = e.target.checked; store.set("auto", settings.auto); schedule(); });
  function schedule() {
    clearInterval(state.timer);
    if (settings.auto) state.timer = setInterval(() => { if (!document.hidden && !state.demo) load(state.mode); }, 60000);
  }
  setInterval(tickCountdown, 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !state.demo) load(state.mode); });
  window.addEventListener("resize", () => { const d = state.cache[state.mode]; if (d && state.lastRec) drawChart(d, state.lastRec); });
  if (window.matchMedia) {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const redraw = () => { const d = state.cache[state.mode]; if (d && state.lastRec) drawChart(d, state.lastRec); };
    if (mq.addEventListener) mq.addEventListener("change", redraw);
  }

  render(); schedule(); load(state.mode);
})();
</script>
</body>
</html>
