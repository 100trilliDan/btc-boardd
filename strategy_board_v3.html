<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>BTC·ETH·SOL 전략 보드</title>
<style>
/* 색: 캔들 상승/하락·강조색은 dataviz validate_palette.js 로 라이트·다크 모두 검증(색약 분리 ΔE 8 이상, 일반시각 15 이상, 표면 대비 4.5:1 이상). 상태는 색만으로 전달하지 않고 아이콘+글자를 함께 씁니다. */
:root{--page:#edf0f3;--surface:#fbfcfc;--well:#e5eaee;--line:#d9dfe4;--line-2:#c3ccd4;--ink:#121b24;--ink-2:#4a5866;--ink-3:#5c6976;
--accent:#3d70d1;--accent-fill:#3d70d1;--up-t:#026c45;--down-t:#b82320;--wash:rgba(61,112,209,.12);--up:#03734a;--up-fill:#03734a;--down:#c22826;--down-fill:#c22826;--on-fill:#fff;--warn-fill:#fab219;--on-warn:#0b0b0b;--warn-ink:#8a5a00;
--font:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0c1117;--surface:#151d25;--well:#1c2730;--line:#26323d;--line-2:#35434f;--ink:#e6edf2;--ink-2:#a9b6c2;--ink-3:#8c9aa7;
--accent:#578cf0;--accent-fill:#3a68c8;--up-t:#33b884;--down-t:#f37a72;--wash:rgba(87,140,240,.16);--up:#1d9a68;--up-fill:#068558;--down:#ec544b;--down-fill:#c44039;--warn-ink:#e0a53a;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.5 var(--font);word-break:keep-all;overflow-wrap:break-word}
button,input{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:1160px;margin:0 auto;padding:0 max(14px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.ico{display:inline-block;width:1em;height:1em;flex:none}.ico svg{display:block;width:100%;height:100%}
.num{font-variant-numeric:tabular-nums}.pos{color:var(--up-t)}.neg{color:var(--down-t)}.dim{color:var(--ink-2)}

/* 상단 바 */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;background:var(--page);padding:max(10px,env(safe-area-inset-top)) 0 8px}
.bar h1{font-size:17px;font-weight:750;margin:0 auto 0 0;letter-spacing:-.01em}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:1;padding:7px 10px;border-radius:999px;background:var(--well);color:var(--ink-2);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.55}
.chip.live{color:var(--ink)}.chip.live::before{background:var(--up);opacity:1}
.chip.warn{background:var(--warn-fill);color:var(--on-warn)}.chip.warn::before{background:var(--on-warn);opacity:1}
.icon{width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:12px;background:transparent;color:var(--ink-2);padding:0}
.icon:hover{background:var(--well)}.icon[aria-expanded=true]{background:var(--well);color:var(--ink)}.icon[disabled]{opacity:.5;cursor:default}
.icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:no-preference){@keyframes spin{to{transform:rotate(360deg)}}.icon[disabled] svg{animation:spin 1s linear infinite}}
.btn{border:0;box-shadow:inset 0 0 0 1px var(--line-2);background:var(--surface);border-radius:9px;min-height:40px;padding:0 14px;font-size:13px;font-weight:600}
.settings{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:14px;padding:12px 14px;margin:2px 0 10px;font-size:13px;color:var(--ink-2)}
.settings label{display:flex;align-items:center;gap:8px;min-height:40px}
.settings input[type=number]{width:96px;height:36px;border:0;box-shadow:inset 0 0 0 1px var(--line-2);border-radius:9px;background:var(--page);padding:0 10px;text-align:right;color:var(--ink)}
.settings input[type=checkbox]{width:22px;height:22px;margin:0;accent-color:var(--accent)}
.settings p{flex-basis:100%;margin:0;font-size:12px;color:var(--ink-3)}
.err{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);box-shadow:inset 4px 0 0 var(--down),inset 0 0 0 1px var(--line);border-radius:10px;padding:10px 14px 10px 18px;margin:0 0 10px;font-size:13px}
.screens{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--well);border-radius:12px;padding:3px;margin:2px 0 14px;max-width:420px}
.screens button{border:0;background:transparent;padding:9px 0;border-radius:9px;font-weight:650;color:var(--ink-2)}
.screens button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}

/* 판정판 배치: 폰은 한 줄로 쌓고, 넓은 화면은 왼쪽에 판정판·오른쪽에 상세 */
.layout{display:block}
@media (min-width:980px){.layout{display:grid;grid-template-columns:minmax(400px,440px) minmax(0,1fr);gap:26px;align-items:start}.left{position:sticky;top:64px}}

/* 지금 할 일 */
.verdict{padding:2px 0 14px}
.v-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px}
.v-lead{font-size:15px;font-weight:500;color:var(--ink-2)}
.v-main{font-size:26px;line-height:1.2;font-weight:760;letter-spacing:-.015em}
.v-warn{display:flex;gap:8px;align-items:flex-start;margin:8px 0 0;padding:8px 10px;border-radius:9px;background:var(--warn-fill);color:var(--on-warn);font-size:13px;font-weight:600}
.v-list{display:grid;gap:8px;margin-top:12px}
.sigrow{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:2px 10px;width:100%;text-align:left;border:0;border-radius:12px;padding:10px 12px;color:var(--on-fill);background:var(--up-fill)}
.sigrow.short{background:var(--down-fill)}
.sigrow .ico{font-size:20px;grid-row:span 2}
.sigrow .who{font-weight:700;font-size:15px}
.sigrow .nums{font-size:12.5px;font-variant-numeric:tabular-nums}
.holdrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.hchip{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;min-height:40px;padding:0 14px 0 11px;background:var(--wash);box-shadow:inset 0 0 0 1.5px var(--accent);font-size:13px;font-weight:600;color:var(--ink)}
.hchip.skip{background:var(--warn-fill);color:var(--on-warn);box-shadow:none}
.v-next{margin:12px 0 0;font-size:12.5px;color:var(--ink-2)}

/* 3×3 판정판 */
.board{width:calc(100% + 12px);margin:-6px;border-collapse:separate;border-spacing:6px;table-layout:fixed}
.board th{font-weight:600;color:var(--ink-2);text-align:left;vertical-align:middle;padding:0}
.board thead th{text-align:center;font-size:13px;color:var(--ink);padding-bottom:2px}
.board thead small{display:block;font-size:10.5px;font-weight:400;color:var(--ink-3);line-height:1.3}
.board col.rh{width:66px}
.board tbody th{padding-right:2px}
.rh-sym{display:block;font-size:15px;font-weight:750;color:var(--ink)}
.rh-px{display:block;font-size:11.5px;font-weight:500;color:var(--ink-2);font-variant-numeric:tabular-nums}
.board td{padding:0}
.cell{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;min-height:92px;padding:9px 8px 8px;border:0;border-radius:12px;text-align:left;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2)}
.cell .ico{font-size:19px}
.cell .lb{font-size:14.5px;font-weight:720;line-height:1.2;color:var(--ink)}
.cell .sb{font-size:11px;line-height:1.3;font-weight:500}
.cell .sb.r{font-size:14px;font-weight:750;font-variant-numeric:tabular-nums}
.cell.wait .ico{color:var(--ink-3)}.cell.wait .lb{color:var(--ink-2);font-weight:620}.cell.wait .sb{color:var(--ink-3)}
.cell.sig{background:var(--up-fill);color:var(--on-fill);box-shadow:none}.cell.sig.short{background:var(--down-fill)}
.cell.sig .lb,.cell.sig .sb{color:var(--on-fill)}
.cell.hold{background:var(--wash);box-shadow:inset 0 0 0 2px var(--accent)}.cell.hold .ico{color:var(--accent)}.cell.hold .sb{color:var(--ink-2)}
.cell.skip{background:var(--warn-fill);color:var(--on-warn);box-shadow:none}.cell.skip .lb,.cell.skip .sb,.cell.skip .ico{color:var(--on-warn)}
.cell[aria-pressed=true]{box-shadow:0 0 0 3px var(--page),0 0 0 5.5px var(--ink)}
.cell.wait[aria-pressed=true]{box-shadow:0 0 0 3px var(--page),0 0 0 5.5px var(--ink),inset 0 0 0 1px var(--line)}
.cell.empty{opacity:.55;cursor:default}
.cell .sb.r.pos{color:var(--up-t)}.cell .sb.r.neg{color:var(--down-t)}
.tb tr.me td{background:var(--wash)}
.hint{margin:12px 0 0;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2)}
.hint span{display:inline-flex;align-items:center;gap:5px}.hint .ico{font-size:14px;color:var(--ink-3)}
.hint .up{color:var(--up-t)}.hint .dn{color:var(--down-t)}.hint .ac{color:var(--accent)}

/* 상세 */
.sheet{background:var(--surface);border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);scroll-margin-top:64px;outline:none;margin-top:18px;overflow:hidden}
@media (min-width:980px){.sheet{margin-top:0}}
.sheet .sec{padding:14px 16px;border-top:1px solid var(--line)}.sheet .sec:first-child{border-top:0}
.s-head{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px}
.s-sym{font-size:19px;font-weight:760;letter-spacing:-.01em;line-height:1.25}.s-str{font-size:12.5px;color:var(--ink-2);line-height:1.3}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px 5px 9px;font-weight:700;font-size:13px;background:var(--well);color:var(--ink-2)}.badge .ico{font-size:15px}
.badge.sig{background:var(--up-fill);color:var(--on-fill)}.badge.sig.short{background:var(--down-fill)}
.badge.hold{background:var(--wash);box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--ink)}.badge.hold .ico{color:var(--accent)}
.badge.skip{background:var(--warn-fill);color:var(--on-warn)}
.s-price{justify-self:end;font-size:22px;font-weight:720;letter-spacing:-.01em;line-height:1.25}.s-head .badge{justify-self:end}
.sec h3{margin:0 0 10px;font-size:13px;font-weight:700;color:var(--ink-2)}
.tk{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:14px 16px}
.tk .k{font-size:12px;color:var(--ink-2);line-height:1.35}
.tk .v{font-size:21px;font-weight:720;line-height:1.25;letter-spacing:-.01em}
.tk .s{font-size:12px;color:var(--ink-2);line-height:1.35}
.tk .wide{grid-column:1/-1}.tk .wide .v{font-size:14.5px;font-weight:650;letter-spacing:0}
.sz{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:10px 16px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line-2)}
.sz .k{font-size:12px;color:var(--ink-2)}.sz .v{font-size:15px;font-weight:650}.sz .s{font-size:12px;color:var(--ink-2)}
.basis{margin:12px 0 0;font-size:12px;color:var(--ink-3)}
.line{font-size:13px;margin:8px 0 0}.line.dim{color:var(--ink-2)}.line.warn{color:var(--warn-ink);font-weight:600}
.callout{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--warn-fill);color:var(--on-warn);font-size:13.5px;font-weight:600}.callout .ico{font-size:18px;margin-top:1px}
.note{font-size:12px;color:var(--ink-3);margin:8px 0 0}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:11px}
.checks li{display:grid;grid-template-columns:20px 1fr;gap:0 10px;align-items:start}
.checks .ic{width:20px;height:20px;display:grid;place-items:center;margin-top:0}.checks .ic .ico{font-size:17px}
.checks li.ok .ic{color:var(--up)}.checks li.no .ic{color:var(--down)}.checks li.info .ic{color:var(--ink-3)}
.checks .ct{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2)}.checks .ct.solo{font-size:13.5px;font-weight:650;color:var(--ink)}.checks .cv{display:block;font-size:14.5px;font-weight:700;line-height:1.35}.checks .cs{display:block;font-size:12.5px;color:var(--ink-2)}
.trg{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tg{font-size:12px;padding:3px 10px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--ink-2);white-space:nowrap}
.tg.win{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--ink)}.tg.on{background:var(--accent-fill);box-shadow:none;color:#fff;font-weight:700}

/* 차트 */
.cbox{padding:10px 12px 14px}
.c-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:4px 4px 8px}
.c-title{font-size:14px;font-weight:700;margin:0 auto 0 0}
.seg{display:inline-flex;background:var(--well);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;min-height:38px;padding:0 13px;font-size:12.5px;font-weight:650;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.ro{padding:0 4px 6px;font-size:12.5px;color:var(--ink-2)}
.ro .r0{display:flex;align-items:baseline;gap:8px}.ro .tm{font-weight:700;color:var(--ink)}.ro .chg{margin-left:auto;font-weight:650;font-variant-numeric:tabular-nums}
.ro .ohlc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 8px;margin-top:3px}.ro .ohlc small{display:block;font-size:11px;line-height:1.3;color:var(--ink-3)}.ro .ohlc span{display:block;font-size:13px;font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.ro .r2,.ro .r3{margin-top:2px}
.chart{touch-action:pan-y;position:relative;border-radius:8px;outline:none}.chart:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.chart svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2);padding:8px 4px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{display:inline-block;width:14px;border-top:2px solid;vertical-align:middle}
.legend .sw{width:10px;height:10px;border:0;border-radius:2px}
.legend .ico{font-size:12px}
.tblwrap{max-height:340px;overflow:auto;border-radius:8px;box-shadow:inset 0 0 0 1px var(--line)}
table.tb{width:100%;border-collapse:collapse;font-size:12.5px}.tb th,.tb td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}.tb th:first-child,.tb td:first-child{text-align:left}.tb th{color:var(--ink-2);font-weight:600;position:sticky;top:0;background:var(--surface)}
details.rec summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--ink-2);padding:10px 0;margin:-10px 0}
details.rec[open] summary{margin-bottom:0}

/* 전략 정보 */
.info{max-width:760px}
.itabs{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--well);border-radius:12px;padding:3px;margin-bottom:14px}
.itabs button{border:0;background:transparent;padding:8px 2px;border-radius:9px;font-weight:650;color:var(--ink-2);line-height:1.3}.itabs button small{display:block;font-weight:400;font-size:11px}
.itabs button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.panel{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.panel h2{font-size:15px;font-weight:720;margin:0 0 12px}.panel h3{font-size:13px;font-weight:700;color:var(--ink-2);margin:16px 0 8px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.sum div{background:var(--well);border-radius:10px;padding:9px 11px}.sum b{display:block;font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}.sum span{font-size:11.5px;color:var(--ink-2)}
.panel ul{padding-left:18px;margin:6px 0}.panel li{font-size:13px;color:var(--ink-2);margin:4px 0}
.legrow{display:grid;grid-template-columns:28px 1fr;gap:2px 10px;align-items:start;margin:10px 0}
.legrow .ico{font-size:22px}.legrow b{font-size:13.5px}.legrow p{margin:0;font-size:12.5px;color:var(--ink-2)}
.foot{font-size:11.5px;color:var(--ink-3);margin:22px 0 0;max-width:760px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--page);padding:9px 15px;border-radius:9px;font-size:13px;z-index:50}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <h1>전략 보드</h1>
    <span class="chip" id="status">불러오는 중</span>
    <button class="icon" id="refresh" aria-label="새로고침" title="새로고침"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.4 5.7"/><path d="M20 4.5V11h-6.5"/></svg></button>
    <button class="icon" id="gear" aria-label="설정" aria-expanded="false" aria-controls="settings" title="설정"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.4"/><circle cx="8" cy="17" r="2.4"/></svg></button>
  </header>
  <section class="settings" id="settings" aria-label="설정" hidden>
    <label>계좌(USDT) <input id="balance" type="number" inputmode="decimal" min="0" step="100"></label>
    <label>거래당 위험(%) <input id="risk" type="number" inputmode="decimal" min="0.1" max="3" step="0.1"></label>
    <label><input type="checkbox" id="auto"> 60초 자동 갱신</label>
    <p>진입 티켓의 수량과 위험금액은 이 값으로 계산합니다. 이 화면은 자동으로 주문하지 않습니다.</p>
  </section>
  <div class="err" id="error" role="alert" hidden><span id="error-msg"></span> <button class="btn" id="demo">데모로 보기</button></div>
  <nav class="screens" role="tablist" aria-label="화면">
    <button role="tab" id="tab-board" data-screen="board" aria-selected="true" aria-controls="screen-board">판정판</button>
    <button role="tab" id="tab-info" data-screen="info" aria-selected="false" aria-controls="screen-info">전략 정보</button>
  </nav>
  <main id="screen-board" role="tabpanel" aria-labelledby="tab-board">
    <div class="layout">
      <div class="left">
        <section id="verdict" class="verdict" aria-live="polite"></section>
        <section aria-label="코인과 전략별 판정">
          <table class="board" id="board"></table>
          <p class="hint" id="hint"></p>
        </section>
      </div>
      <section class="sheet" id="detail" tabindex="-1" aria-label="선택한 판정의 상세" hidden></section>
    </div>
  </main>
  <main id="screen-info" class="info" role="tabpanel" aria-labelledby="tab-info" hidden></main>
  <p class="foot">참고용 정보이며 투자 조언이 아닙니다. 백테스트는 과거 성과이며 미래를 보장하지 않습니다. 실제 거래에서는 거래소에 손절 주문을 반드시 직접 걸어 두세요. 이 화면은 자동으로 주문하지 않습니다.</p>
</div>
<div class="toast" id="toast" hidden></div>
<script>
/* 두 전략의 순수 계산 코어 (브라우저/노드 공용). 미래참조 없음: 모든 상위봉 값은 '마감된' 봉만 사용. */

/* ───── 조립: 상태 칩 · 화면 전환 · 불러오기 · 이벤트 ───── */
function setChip() {
  const d = st.data, ch = $("status");
  if (!d) { ch.className = "chip"; ch.textContent = st.loading ? "불러오는 중" : "데이터 없음"; return; }
  if (st.fail && d.live) { ch.className = "chip warn"; ch.textContent = "갱신 실패 · " + ft(d.at).slice(6) + " 데이터"; }   // 선물 시세 갱신이 실패하면 현물로 바꾸지 않고, 오래된 데이터임을 계속 표시
  else { ch.className = "chip " + (d.live ? "live" : "warn"); ch.textContent = (d.live ? "실시간(" + d.src + ") " : "데모 데이터 ") + ft(d.at).slice(6); }
}
function render() {
  const d = st.data; setChip();
  if (!d) { st.an = null; st.anFor = null; st.board = null; }
  else { if (st.anFor !== d) { st.an = SYMS.map((s) => analyze(d.coins[s])); st.anFor = d; } st.board = buildBoard(st.an); st.sel = pickSel(st.board); }
  renderVerdict(); renderBoard();
  if (st.screen === "board") renderDetail();
}

  st.screen = name; store.set("screen", name);
  $("screen-board").hidden = name !== "board"; $("screen-info").hidden = name !== "info";
  document.querySelectorAll(".screens button").forEach((b) => { const on = b.dataset.screen === name; b.setAttribute("aria-selected", String(on)); b.tabIndex = on ? 0 : -1; });
  if (name === "info") renderInfo(); else renderDetail();
}
async function load() {
  if (st.loading) return; st.loading = true; $("refresh").disabled = true; setChip();
  try { st.data = st.demo ? demoAll() : await liveAll(); st.fail = null; $("error").hidden = true; }
  catch (e) {
    st.fail = (e && e.message) || "네트워크 오류";
    if (!st.data) { $("error-msg").textContent = "바이낸스 선물 시세를 불러오지 못했습니다 (" + st.fail + "). 인터넷, VPN, 지역 제한을 확인해 주세요. 현물 시세로는 대체하지 않습니다."; $("demo").hidden = false; $("error").hidden = false; }
    else { $("error-msg").textContent = "시세 갱신에 실패했습니다 (" + st.fail + "). " + ft(st.data.at).slice(6) + " 데이터를 표시 중이라 신호가 최신이 아닐 수 있습니다. 현물 시세로는 대체하지 않습니다."; $("demo").hidden = true; $("error").hidden = false; toast("갱신 실패: 이전 데이터를 표시 중"); }
  }

function schedule() { clearInterval(st.timer); if (cfg.auto) st.timer = setInterval(() => { if (!document.hidden && !st.demo) load(); }, 60000); }
$("balance").value = cfg.balance; $("risk").value = cfg.risk; $("auto").checked = cfg.auto;
$("balance").onchange = (e) => { cfg.balance = Math.max(0, +e.target.value || 0); store.set("balance", cfg.balance, 1); render(); };
$("risk").onchange = (e) => { cfg.risk = Math.min(3, Math.max(0.1, +e.target.value || 1)); e.target.value = cfg.risk; store.set("risk", cfg.risk, 1); render(); };
$("auto").onchange = (e) => { cfg.auto = e.target.checked; store.set("auto", cfg.auto, 1); schedule(); };
$("refresh").onclick = load; $("demo").onclick = () => { st.demo = true; load(); };
$("gear").onclick = () => { const s = $("settings"), open = s.hidden; s.hidden = !open; $("gear").setAttribute("aria-expanded", String(open)); if (open) $("balance").focus({ preventScroll: true }); };
document.querySelectorAll(".screens button").forEach((b) => {
